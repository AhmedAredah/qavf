name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POLARS_MAX_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            python: "3.12"
          - platform: linux
            runner: ubuntu-latest
            python: "3.13"
          - platform: linux
            runner: ubuntu-latest
            python: "3.14"
          - platform: windows
            runner: windows-latest
            python: "3.12"
          - platform: macos
            runner: macos-latest
            python: "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development and optional dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Check lint, types and generated documentation
        if: matrix.platform == 'linux' && matrix.python == '3.12'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy qavf scripts
          uv run --no-sync python scripts/generate_docs.py --check
      - name: Verify full source and installed wheel on this platform
        run: >-
          uv run --no-sync python scripts/verify_platform.py
          --output-dir release-evidence/platform
      - name: Check installed core wheel in normal and optimized Python
        if: matrix.platform == 'linux' && matrix.python == '3.12'
        run: >-
          uv run --no-sync python scripts/verify_release.py installed
          --mode core --id core --output-dir release-evidence/core
      - name: Preserve execution evidence and built distributions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}-${{ matrix.python }}
          path: |
            release-evidence/
            dist/
          if-no-files-found: warn
          retention-days: 14
