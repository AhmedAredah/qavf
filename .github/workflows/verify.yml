name: Release assurance
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: '0.13.5'
  POLARS_MAX_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy qavf scripts
      - run: uv run --no-sync python scripts/generate_docs.py --check
      - run: uv run --no-sync python scripts/verify_platform.py --output-dir "${{ runner.temp }}/qavf-evidence/linux-${{ matrix.python }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-${{ matrix.python }}
          path: ${{ runner.temp }}/qavf-evidence
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qavf-distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-3.12
          - os: macos-latest
            label: macos-3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync python scripts/verify_platform.py --output-dir "${{ runner.temp }}/qavf-evidence/${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.label }}
          path: ${{ runner.temp }}/qavf-evidence
          if-no-files-found: error
  dependency-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-extras
      - run: uv build --clear
      - run: uv run --no-sync python scripts/verify_dist.py
      - run: uv run --no-sync python scripts/verify_release.py installed --id floors --mode floors --output-dir "${{ runner.temp }}/qavf-evidence/floors"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-floors
          path: ${{ runner.temp }}/qavf-evidence
          if-no-files-found: error
  core-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv build --clear
      - run: uv run --no-sync python scripts/verify_dist.py
      - run: uv run --no-sync python scripts/verify_release.py installed --id core --mode core --output-dir "${{ runner.temp }}/qavf-evidence/core"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-core
          path: ${{ runner.temp }}/qavf-evidence
          if-no-files-found: error
  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qavftest
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: qavftest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qavftest"
          --health-interval 5s --health-timeout 5s --health-retries 12
      s3:
        image: motoserver/moto:5.1.15
        ports: ['5000:5000']
    env:
      QAVF_INTEGRATION_MODE: required
      QAVF_POSTGRES_DSN: postgresql://qavftest:disposable-test-password@127.0.0.1:5432/qavftest
      QAVF_S3_ENDPOINT: http://127.0.0.1:5000
      QAVF_S3_ACCESS_KEY: disposable-test-access
      QAVF_S3_SECRET_KEY: disposable-test-secret
      QAVF_S3_REGION: us-east-1
      # Public, disposable emulator credentials; never a production account.
      QAVF_AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=qavftest;AccountKey=cWF2Zi1kaXNwb3NhYmxlLXRlc3Qta2V5LTEyMzQ1Njc4OTA=;BlobEndpoint=http://127.0.0.1:10000/qavftest;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Start disposable Azure Blob emulator
        run: >-
          docker run --detach --name qavf-azurite -p 10000:10000
          -e AZURITE_ACCOUNTS=qavftest:cWF2Zi1kaXNwb3NhYmxlLXRlc3Qta2V5LTEyMzQ1Njc4OTA=
          mcr.microsoft.com/azure-storage/azurite:3.35.0
          azurite --blobHost 0.0.0.0 --skipApiVersionCheck
      - name: Wait for the object stores
        run: |
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:5000/moto-api/
          # Azurite rejects anonymous requests; any HTTP response means it is listening.
          curl --silent --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:10000/
      - run: uv sync --locked --all-extras --group integration
      - run: uv run --no-sync python scripts/verify_release.py extensions --integration
      - run: uv run --no-sync python scripts/verify_release.py test --integration --id integrations --output "${{ runner.temp }}/qavf-evidence/integrations.json" tests/integration
      - name: Remove owned emulator
        if: always()
        run: docker rm --force qavf-azurite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-integrations
          path: ${{ runner.temp }}/qavf-evidence
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [test, dependency-floors, platform-contracts, core-installation, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/qavf-evidence
      - name: Reject missing, failed, stale or incomplete evidence
        env:
          QAVF_CI_JOBS: ${{ toJSON(needs) }}
        run: uv run --no-sync python scripts/verify_release.py aggregate --evidence-dir "${{ runner.temp }}/qavf-evidence" --output "${{ runner.temp }}/release-assurance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-assurance
          path: ${{ runner.temp }}/release-assurance.json
          if-no-files-found: error

  # Publishing runs only for v* tags, after every required job and the strict
  # aggregate passed. It ships the exact distributions those jobs verified.
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: aggregate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qavf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qavf-distributions-3.12
          path: dist
      - name: Require the tag to match the verified package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          test -f "dist/qavf-${TAG#v}-py3-none-any.whl"
          test -f "dist/qavf-${TAG#v}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qavf-distributions-3.12
          path: dist
      - name: Create the release with distributions and SHA-256 hashes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "QAVF ${TAG#v}" --generate-notes --verify-tag

  container:
    name: Container image
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qavf-distributions-3.12
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ahmedaredah/qavf
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
