# yaml-language-server: $schema=qavf.schema.json
#
# QAVF demo configuration. Run it with:   qavf run -c qavf.yaml
# Relative paths resolve against this file's directory.

project: Traffic monitoring demo

# Named values, used as ${vars.<name>}. `2016..2024` is every year in that range.
vars:
  years: 2016..2024

# ---------------------------------------------------------------------------
# Datasets: where each table comes from, and the QA limits for its columns.
# ---------------------------------------------------------------------------
datasets:
  sites:
    description: Site inventory, read from a DuckDB database.
    source: {type: database, connection: inventory, table: sites}
    schema:
      primary_key: [site_id]
      columns:
        site_id: {dtype: str, regex: 'S\d{2}'}
        region: {dtype: str, isin: [North, South]}
        functional_class: {dtype: str, isin: [Interstate, Arterial, Collector]}
        lanes: {dtype: int, ge: 1, le: 12}
        latitude: {dtype: float, ge: 25.8, le: 36.5}       # Texas bounding box
        longitude: {dtype: float, ge: -106.7, le: -93.5}

  counts:
    description: Annual traffic counts per site, from a CSV file.
    path: data/counts.csv
    schema:
      primary_key: [site_id, year]
      columns:
        site_id:
          dtype: str
          checks:
            - {regex: 'S\d{2}', severity: WARNING, name: site id format}
        year: {dtype: int, ge: 2000, le: 2030}
        aadt:
          dtype: int
          ge: 0                                          # ERROR (the rule's default)
          checks:
            - {le: 200000, severity: WARNING, name: implausibly high AADT}
            - {mean: {ge: 1000, le: 100000}, severity: INFO, name: network average}
        truck_share:
          dtype: float
          ge: 0
          le: 1                                          # a share, not a percentage
        count_date:
          dtype: date
          le: 2025-12-31
        count_type: {dtype: str, isin: [permanent, portable]}
    foreign_keys:
      - {columns: [site_id], ref_dataset: sites}
    # Time series defined once and named by the temporal checks below.
    series:
      aadt_by_site: {value: aadt, group_by: [site_id], time_column: year}
    # Checks of this dataset. `qavf list-checks` lists every check and its settings.
    checks:
      - check: change_rate            # period-over-period change
        series: aadt_by_site
        max: 0.15                     # 15 % per year
      - check: trend                  # trend direction (needs qavf[stats])
        series: aadt_by_site
        expect: increasing
        tags: [stats]
      - check: trend_outliers         # off-trend years (needs qavf[stats])
        series: aadt_by_site
        tags: [stats]
      - check: missing_periods
        name: no missing years
        series: aadt_by_site
        expected: ${vars.years}
      - check: matches_baseline       # compare with the accepted counts
        path: baseline/counts.csv
        keys: [site_id, year]
        rtol: 1.0e-9

  crashes:
    description: Annual crashes per site, from a Parquet file.
    path: data/crashes.parquet
    schema:
      primary_key: [site_id, year]
      columns:
        crashes: {dtype: int, ge: 0}
        fatal: {dtype: int, ge: 0}
    foreign_keys:
      - {columns: [site_id], ref_dataset: sites}
    # Crashes per vehicle (AADT from counts), per site and year.
    metrics:
      crash_rate: {value: crashes, entity: site_id, group_by: [year], per: counts.aadt}
    checks:
      - {check: expression, expr: fatal <= crashes, name: fatal within total}
      # Expressions may query other datasets by name:
      - check: expression
        expr: year IN (SELECT year FROM counts)
        name: year has counts
        severity: WARNING
      - check: entity_outliers        # sites whose crash rate is an outlier
        metric: crash_rate
        method: modified_zscore
        min_entities: 5
      - check: group_comparison       # site vs. its region
        metric: crash_rate
        max_ratio: 1.6
        groups:
          North: [S01, S02, S03, S04, S05, S06]
          South: [S07, S08, S09, S10, S11, S12]

# Databases attached for `database` and `query` sources.
connections:
  inventory: {type: duckdb, path: data/sites.duckdb}

# ---------------------------------------------------------------------------
# Checks relating several datasets. Only configured checks run.
# ---------------------------------------------------------------------------
checks:
  - check: sql                      # SQL that returns offending rows
    name: every site has counts
    severity: WARNING
    sql: |
      SELECT s.site_id FROM sites s
      WHERE s.site_id NOT IN (SELECT site_id FROM counts)
  - check: coverage
    name: every site in every year
    datasets: [counts, crashes]
    entity: site_id
    time_column: year
    reference: sites                # the authoritative list of sites

run:
  fail_on: ERROR

engine:
  parallel: true
